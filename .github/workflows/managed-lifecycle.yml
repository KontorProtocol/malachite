name: Managed engine lifecycle

on:
  pull_request:
    paths:
      - 'code/**'
      - 'tools/lifecycle-vendor/**'
      - '.github/workflows/managed-lifecycle.yml'
  push:
    branches:
      - main
      - 'kontor/managed-engine-lifecycle'
    paths:
      - 'code/**'
      - 'tools/lifecycle-vendor/**'
      - '.github/workflows/managed-lifecycle.yml'

permissions:
  contents: read

jobs:
  lifecycle:
    name: Lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: short
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Verify lifecycle vendor provenance
        working-directory: .
        run: python3 tools/lifecycle-vendor/vendor.py
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          toolchain: 1.99.1
          cache-workspaces: code
      - name: Record compiler and platform
        run: |
          rustc -vV
          uname -a
      - name: Exercise real managed engines and quiet interface watchers
        run: cargo test --locked -j2 -p arc-malachitebft-app-channel --test managed_lifecycle --test managed_network_teardown -- --nocapture
      - name: Verify supervision and WAL failure behavior
        run: cargo test --locked -j2 -p arc-malachitebft-engine -p arc-malachitebft-app-channel --lib
