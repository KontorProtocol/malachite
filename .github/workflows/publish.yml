name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - v[0-9]+.*

jobs:
  publish:
    # Upstream publication/issue automation has no destination in this fork.
    if: github.repository == 'circlefin/malachite'
    name: Publish to crates.io
    runs-on: ${{ vars.CI_RUNNER_LARGE || 'ubuntu-24.04' }}
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2
        with:
          toolchain: 1.99.1
          cache-workspaces: "code"
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1.0.3
        id: auth
      - name: Publish crates
        uses: step-security/publish-crates@354be9c74404760ffbfcae1bd39a4f05c19b6578 # v2.0.0
        with:
          registry-token: ${{ steps.auth.outputs.token }}
          path: code
